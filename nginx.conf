server {
    listen 8080;
    server_name _;
    absolute_redirect off;   # keep redirects relative behind port mappings / Tailscale

    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The HTML shell must revalidate so new releases are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

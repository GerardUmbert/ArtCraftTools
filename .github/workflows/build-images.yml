name: Build images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # daily: pick up new upstream releases
  push:
    branches: [main]
    paths: [Dockerfile, nginx.conf, scripts/**, apps.json, .github/workflows/build-images.yml]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [photocraft, wordcraft, gridcraft, deckcraft, lightcraft, vectorcraft,
              designcraft, pdfcraft, filmcraft, effectcraft, soundcraft, cadcraft]
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/gerardumbert/${{ matrix.app }}-web
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream web build
        id: fetch
        run: |
          version="$(bash scripts/fetch-web.sh '${{ matrix.app }}' | tail -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already published
        id: check
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.fetch.outputs.version }}" >/dev/null 2>&1 \
             && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP=${{ matrix.app }}
            VERSION=${{ steps.fetch.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.fetch.outputs.version }}

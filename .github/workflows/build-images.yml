name: Build images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # daily: pick up new upstream releases
  push:
    branches: [main]
    paths: [Dockerfile, nginx-main.conf, Dockerfile.aio, nginx.conf, nginx-aio.conf, aio/**, icons/**, scripts/**, apps.json, .github/workflows/build-images.yml]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [photocraft, wordcraft, gridcraft, deckcraft, lightcraft, vectorcraft,
              designcraft, pdfcraft, filmcraft, effectcraft, soundcraft, cadcraft]
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/gerardumbert/${{ matrix.app }}-web
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream web build
        id: fetch
        run: |
          version="$(bash scripts/fetch-web.sh '${{ matrix.app }}' | tail -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already published
        id: check
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.fetch.outputs.version }}" >/dev/null 2>&1 \
             && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          build-args: |
            APP=${{ matrix.app }}
            VERSION=${{ steps.fetch.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.fetch.outputs.version }}

  aio:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/gerardumbert/artcraft-aio
    steps:
      - uses: actions/checkout@v4

      - name: Fetch every upstream web build
        run: |
          for app in photocraft wordcraft gridcraft deckcraft lightcraft vectorcraft                      designcraft pdfcraft filmcraft effectcraft soundcraft cadcraft; do
            DEST="aio-build/$app" bash scripts/fetch-web.sh "$app" | tail -n1 | sed "s/^/$app /"
          done | tee versions.txt

      - name: Skip if this set of upstream versions is already published
        id: check
        run: |
          fp="src-$(sha256sum versions.txt | cut -c1-12)"
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$fp" >/dev/null 2>&1 \
             && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          file: Dockerfile.aio
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.check.outputs.fp }}
